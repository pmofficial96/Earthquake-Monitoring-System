services:
  - type: web
    name: seismic-watch-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: USGS_API_BASE
        value: https://earthquake.usgs.gov/fdsnws/event/1/query
